,170px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:0\">\n      <p style=\"font-weight:700;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:18px\">Boats · Jet skis · ATVs · Snowmobiles · Kayaks · Everything<\u002Fp>\n      <h1 style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:clamp(40px,6.5vw,68px);font-weight:800;letter-spacing:-.035em;line-height:1.03;text-wrap:balance;color:#0B1C2C\">Every adventure rental.<br>One <span style=\"background:linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8);-webkit-background-clip:text;background-clip:text;color:transparent\">map<\u002Fspan>.<\u002Fh1>\n      <p style=\"max-width:560px;margin-top:20px;font-size:17.5px;color:#5A7386;text-wrap:pretty\">JourneyLane maps the real rental operators around you — what they rent, where they are, and how to reach them. Stop searching five apps and a phone book. Find a Journey.<\u002Fp>\n      <div role=\"search\" style=\"display:flex;width:100%;max-width:600px;margin-top:32px;background:#fff;border:1.5px solid #DCEBF4;border-radius:999px;padding:6px;box-shadow:0 2px 6px rgba(11,28,44,.05), 0 18px 44px rgba(32,152,224,.14);gap:6px\" style-focus=\"border-color:#2098E0\">\n        <input type=\"search\" value=\"{{ q }}\" sc-camel-on-change=\"{{ onSearch }}\" sc-camel-on-key-down=\"{{ onSearchKey }}\" placeholder=\"Search a place or a machine — “pontoon”, “Gatineau”, “UTV”…\" aria-label=\"Search rentals\" style=\"flex:1;min-width:0;border:0;outline:0;background:none;padding:10px 18px;font:inherit;font-size:16px;color:#0B1C2C\">\n        <button type=\"button\" sc-camel-on-click=\"{{ goExplore }}\" style=\"border:0;border-radius:999px;padding:12px 28px;background:linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8);color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 14px rgba(32,152,224,.3)\" style-hover=\"filter:brightness(1.06);box-shadow:0 6px 20px rgba(0,184,200,.4)\">Explore<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin-top:18px;font-size:14.5px;color:#5A7386\"><b style=\"color:#1E8FD8\">{{ nOps }}<\u002Fb> real rental operators mapped across <b style=\"color:#1E8FD8\">{{ nRegions }}<\u002Fb> regions — and growing.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"directory\" style=\"max-width:1220px;margin:0 auto;padding:clamp(44px,6vw,72px) clamp(16px,4vw,44px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px\">\n      <h2 style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.02em;color:#0B1C2C\">The directory<\u002Fh2>\n      <p style=\"color:#5A7386;font-size:14.5px\">Real rental businesses, listed from public information — every listing links to the operator. <a href=\"#about\">How this works.<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:24px;display:flex;flex-direction:column;gap:12px\">\n      <div role=\"group\" aria-label=\"Filter by category\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ catChips }}\" as=\"ch\" hint-placeholder-count=\"6\">\n          <button type=\"button\" sc-camel-on-click=\"{{ ch.onClick }}\" style=\"{{ ch.style }}\" style-hover=\"border-color:#7FC6E8;box-shadow:0 3px 10px rgba(32,152,224,.12)\">\n            {{ ch.icon }}<span>{{ ch.label }}<\u002Fspan>\n            <sc-if value=\"{{ showCounts }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"{{ ch.nStyle }}\">{{ ch.count }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap\">\n        <div role=\"group\" aria-label=\"Filter by region\" style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ regionChip t-fit:cover\"><\u002Fsc-if>\n              <sc-if value=\"{{ c.noPhoto }}\" hint-placeholder-val=\"{{ false }}\">{{ c.icon }}<\u002Fsc-if>\n              <span style=\"position:absolute;top:10px;left:10px;background:#fff;border:1px solid #E2EDF4;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1E8FD8;border-radius:999px;padding:3px 10px\">{{ c.catLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:16px 18px 18px;display:flex;flex-direction:column;gap:5px;flex:1\">\n              <span style=\"font-weight:700;font-size:16.5px;line-height:1.25;color:#0B1C2C\">{{ c.name }}<\u002Fspan>\n              <span style=\"color:#5A7386;font-size:13.5px\">{{ c.townLine }}<\u002Fspan>\n              <sc-if value=\"{{ c.hasRating }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:13px;font-weight:700;color:#0E7C86\">{{ c.ratingText }}<\u002Fspan><\u002Fsc-if>\n              <span style=\"font-size:13.5px;color:#33506A;margin-top:2px\">{{ c.rentsLine }}<\u002Fspan>\n              <span style=\"margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                <sc-if value=\"{{ c.hasPrice }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-weight:700;font-size:14px;background:linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8);-webkit-background-clip:text;background-clip:text;color:transparent\">{{ c.priceText }}<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ c.noPrice }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#8AA3B5;font-weight:500;font-size:12.5px\">prices: call/see site<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ c.badgeOnline }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:#DFF6F9;color:#007380\">Online booking<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ c.badgePhone }}\" hint-placeholder- ter by what you want to ride.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E2EDF4;border-radius:18px;padding:26px 26px 28px;box-shadow:0 1px 3px rgba(11,28,44,.04)\">\n          <span style=\"display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:linear-gradient(120deg,#2098E0,#18A0D8);color:#fff;font-weight:800;font-size:15px;margin-bottom:14px\">2<\u002Fspan>\n          <h3 style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:18px;font-weight:700;color:#0B1C2C;margin-bottom:6px\">See who rents it<\u002Fh3>\n          <p style=\"color:#5A7386;font-size:14.5px\">Each listing shows the fleet, the town, public prices where posted, and how to book — online or by phone.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #E2EDF4;border-radius:18px;padding:26px 26px 28px;box-shadow:0 1px 3px rgba(11,28,44,.04)\">\n          <span style=\"display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:999px;background:linear-gradient(120deg,#18A0D8,#00B8C8);color:#fff;font-weight:800;font-size:15px;margin-bottom:14px\">3<\u002Fspan>\n          <h3 style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:18px;font-weight:700;color:#0B1C2C;margin-bottom:6px\">Go directly<\u002Fh3>\n          <p style=\"color:#5A7386;font-size:14.5px\">We link you straight to the operator. Booking through JourneyLane itself is coming — this map is day one.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"about\" style=\"max-width:820px;margin:0 auto;padding:clamp(44px,6vw,72px) clamp(16px,4vw,44px)\">\n    <h2 style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.02em;color:#0B1C2C;margin-bottom:16px\">About this directory<\u002Fh2>\n    <p style=\"color:#33506A;font-size:16px;text-wrap:pretty\">JourneyLane is building one home for every recreation rental — watercraft, powersports, and everything that makes a weekend. The directory lists real businesses from their own public information: what they advertise, where they are, and how to reach them. We don't copy their photos or words, prices shown are their posted rates at the date we checked, and any operator can update or remove their listing by contacting us.<\u002Fp>\n    <p style=\"margin-top:16px;color:#33506A;font-size:16px\">Are you a rental operator? This map is free. Reach us any time — <a href=\"mailto:journeylaneinc@gmail.com\">journeylaneinc@gmail.com<\u002Fa>.<\u002Fp>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid #E2EDF4;background:#F7FBFD\">\n  <div style=\"max-width:1220px;margin:0 auto;padding:28px clamp(16px,4vw,44px);display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;justify-content:space-between\">\n    <span style=\"display:flex;align-items:center;gap:9px\">\n      <img src=\"9cc113a2-5dcc-4612-a4b5-4734e1c8b295\" alt=\"\" style=\"width:26px;height:26px;border-radius:7px;display:block\">\n      <span style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em;color:#0B1C2C\">Journey<span style=\"background:linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8);-webkit-background-clip:text;background-clip:text;color:transparent\">Lane<\u002Fspan><\u002Fspan>\n    <\u002Fspan>\n    <p style=\"color:#5A7386;font-size:13px\">Find an adventure. · © JourneyLane Inc. · Listings from public sources, verified on the date shown in each listing.<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ drawerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeDrawer }}\" style=\"position:fixed;inset:0;background:rgba(11,28,44,.34);backdrop-filter:blur(2px);z-index:1000\"><\u002Fdiv>\n  <aside role=\"dialog\" aria-modal=\"true\" style=\"position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);background:#fff;z-index:1001;box-shadow:-16px 0 50px rgba(11,28,44,.22);padding:30px 30px 34px;overflow-y:auto;display:flex;flex-direction:column;gap:0;border-radius:20px 0 0 20px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ closeDrawer }}\" aria-label=\"Close\" style=\"position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:999px;border:1px solid #E2EDF4;background:#fff;color:#5A7386;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center\" style-hover=\"border-color:#7FC6E8;color:#2098E0\">×<\u002Fbutton>\n    <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px\">{{ d.cats }}<\u002Fdiv>\n    <div style=\"font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#0B1C2C\">{{ d.name }}<\u002Fdiv>\n    <div style=\"color:#5A7386;font-size:14.5px;margin-top:4px\">{{ d.townLine }}<\u002Fdiv>\n    <p style=\"margin-top:14px;color:#33506A;font-size:15px;text-wrap:pretty\">{{ d.blurb }}<\u002Fp>\n    <div style=\"margin-top:22px\">\n      <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8AA3B5;margin-bottom:8px\">What they rent<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n        <sc-for list=\"{{ d.rents }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <span style=\"background:#EDF6FA;border:1px solid #DCEBF4;color:#33506A;font-size:13px;font-weight:500;border-radius:999px;padding:4px 12px\">{{ r.t }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ d.hasPrice }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:20px\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8AA3B5;margin-bottom:6px\">Posted prices<\u002Fdiv>\n        <span style=\"font-weight:700;font-size:16px;background:linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8);-webkit-background-clip:text;background-clip:text;color:transparent\">{{ d.priceText }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"margin-top:20px\">\n      <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8AA3B5;margin-bottom:6px\">How to book<\u002Fdiv>\n      <span style=\"color:#33506A;font-size:14.5px\">{{ d.mode }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:26px;display:flex;flex-direction:column;gap:10px\">\n      <sc-if value=\"{{ d.hasSite }}\" hint-placeholder-val=\"{{ true }}\">\n        <a href=\"{{ d.website }}\" target=\"_blank\" rel=\"noopener\" style=\"display:block;text-align:center;background:linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:13px 20px;border-radius:999px;box-shadow:0 6px 18px rgba(32,152,224,.3)\" style-hover=\"filter:brightness(1.06)\">Visit their site<\u002Fa>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ d.hasPhone }}\" hint-placeholder-val=\"{{ true }}\">\n        <a href=\"{{ d.tel }}\" style=\"display:block;text-align:center;background:#fff;border:1.5px solid #DCEBF4;color:#1E8FD8;text-decoration:none;font-weight:700;font-size:15px;padding:12px 20px;border-radius:999px\" style-hover=\"border-color:#7FC6E8;background:#F4FAFD\">Call {{ d.phone }}<\u002Fa>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"margin-top:22px;padding-top:16px;border-top:1px solid #EDF3F7;color:#8AA3B5;font-size:12.5px\">Listed from public information, checked {{ d.verified }}.<\u002Fdiv>\n  <\u002Faside>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroArt&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;chipCounts&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Directory&quot;},&quot;mapTiles&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;carto-light&quot;,&quot;osm&quot;],&quot;default&quot;:&quot;carto-light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Map&quot;}}\">\nclass Component extends DCLogic {\n  state = { ops: [], cat: null, region: null, q: \"\", view: \"list\", drawer: null };\n\n  CATS = {\n    \"boat\": { label: \"Boats\", icon: \"boat\" },\n    \"jet-ski\": { label: \"Jet skis\", icon: \"jetski\" },\n    \"atv\": { label: \"ATVs\", icon: \"atv\" },\n    \"utv\": { label: \"UTVs\", icon: \"atv\" },\n    \"snowmobile\": { label: \"Snowmobiles\", icon: \"snow\" },\n    \"kayak-canoe\": { label: \"Kayaks & canoes\", icon: \"kayak\" },\n    \"ebike\": { label: \"E-bikes\", icon: \"bike\" },\n    \"rv-trailer\": { label: \"RVs & trailers\", icon: \"rv\" },\n    \"ice-hut\": { label: \"Ice huts\", icon: \"hut\" },\n    \"other\": { label: \"More\", icon: \"more\" }\n  };\n  REGIONS = {\n    \"outaouais\": \"Ottawa–Outaouais\", \"ottawa-valley\": \"Ottawa Valley\",\n    \"muskoka\": \"Muskoka\", \"kawarthas\": \"Kawarthas\", \"lake-huron\": \"Lake Huron\", \"other\": \"Elsewhere\"\n  };\n\n  constructor(props) {\n    super(props);\n    this.mapRef = React.createRef();\n    this.map = null; this.markers = null;\n  }\n\n  componentDidMount() {\n    Promise.resolve({json:()=>Promise.resolve(window.__OPERATORS||[])}).then(r => r.json()).then(ops => this.setState({ ops })).catch(() => {});\n    this._esc = (e) => { if (e.key === \"Escape\") this.setState({ drawer: null }); };\n    document.addEventListener(\"keydown\", this._esc);\n  }\n  componentWillUnmount() { document.removeEventListener(\"keydown\", this._esc); }\n  componentDidUpdate() { this.syncMap(); }\n\n  icon(kind, color, size) {\n    const D = {\n      boat: [[\"p\",\"M3 15l2 4h14l2-4\"],[\"p\",\"M4 15h16\"],[\"p\",\"M12 4v11\"],[\"p\",\"M12 5l6 8H12\"]],\n      jetski: [[\"p\",\"M2 17h20l-3 3H6z\"],[\"p\",\"M8 17l3-5h4l3 5\"],[\"p\",\"M11 12V9h3\"]],\n      atv: [[\"c\",6,17,3],[\"c\",18,17,3],[\"p\",\"M6 17h12M8 12h8l2 5M10 12L8 8h5\"]],\n      snow: [[\"p\",\"M3 17h13l4-3\"],[\"p\",\"M3 17l3-3h8\"],[\"p\",\"M8 14l2-5h4l3 5\"],[\"p\",\"M2 20h20\"]],\n      kayak: [[\"p\",\"M3 16q9 4 18 0-9-4-18 0z\"],[\"p\",\"M7 8l10 8M17 8L7 16\"]],\n      bike: [[\"c\",6,16,3.5],[\"c\",18,16,3.5],[\"p\",\"M6 16l4-7h5l3 7M10 9h5\"]],\n      rv: [[\"p\",\"M3 7h13a5 5 0 015 5v4h-2M3 7v9h2m11 0H8\"],[\"c\",6.5,17,1.8],[\"c\",13.5,17,1.8],[\"p\",\"M7 10h4v3H7z\"]],\n      hut: [[\"p\",\"M4 20V10l8-6 8 6v10\"],[\"p\",\"M2 20h20M10 20v-5h4v5\"]],\n      more: [[\"c\",5,12,1.6],[\"c\",12,12,1.6],[\"c\",19,12,1.6]]\n    };\n    const kids = (D[kind] || D.more).map((s, i) => s[0] === \"p\"\n      ? React.createElement(\"path\", { key: i, d: s[1] })\n      : React.createElement(\"circle\", { key: i, cx: s[1], cy: s[2], r: s[3] }));\n    return React.createElement(\"svg\", {\n      viewBox: \"0 0 24 24\", width: size, height: size, fill: \"none\",\n      stroke: color, strokeWidth: 1.8, strokeLinecap: \"round\", strokeLinejoin: \"round\",\n      style: { flex: \"none\", display: \"block\" }\n    }, kids);\n  }\n\n  filtered() {\n    const q = this.state.q.trim().toLowerCase();\n    return this.state.ops.filter(o => {\n      if (this.state.cat && !o.categories.includes(this.state.cat)) return false;\n      if (this.state.region && o.region !== this.state.region) return false;\n      if (q) {\n        const hay = [o.name, o.town, o.blurb, ...(o.rents || []), ...(o.categories || [])].join(\" \").toLowerCase();\n        if (!hay.includes(q)) return false;\n      }\n      return true;\n    });\n  }\n\n  syncMap() {\n    if (this.state.view !== \"map\") { this.map = null; return; }\n    const el = this.mapRef.current;\n    if (!el || !window.L) return;\n    if (!this.map || this.map.getContainer() !== el) {\n      this.map = L.map(el, { scrollWheelZoom: true });\n      const tiles = (this.props.mapTiles ?? \"carto-light\") === \"osm\"\n        ? { url: \"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png\", attr: '&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap<\u002Fa>' }\n        : { url: \"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png\", attr: '&copy; <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap<\u002Fa> &copy; <a href=\"https://carto.com/attributions\">CARTO<\u002Fa>' };\n      L.tileLayer(tiles.url, { attribution: tiles.attr, maxZoom: 18 }).addTo(this.map);\n      this.markers = L.layerGroup().addTo(this.map);\n    }\n    const list = this.filtered();\n    const sig = list.map(o => o.id).join(\",\");\n    if (this._sig === sig) return;\n    this._sig = sig;\n    this.markers.clearLayers();\n    const pts = [];\n    const esc = (s) => String(s ?? \"\").replace(/[&<>\"']/g, c => ({ \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\n    list.forEach(o => {\n      if (typeof o.lat !== \"number\" || typeof o.lng !== \"number\") return;\n      pts.push([o.lat, o.lng]);\n      const m = L.circleMarker([o.lat, o.lng], { radius: 9, color: \"#2098E0\", weight: 2, fillColor: \"#4870F8\", fillOpacity: .85 });\n      m.bindPopup(\n        '<div style=\"font-weight:700;margin-bottom:2px\">' + esc(o.name) + '<\u002Fdiv>' +\n        '<div style=\"color:#5A7386;font-size:13px;margin-bottom:5px\">' + esc(o.town) + ' · ' + esc((o.rents || []).slice(0, 2).join(\", \")) + '<\u002Fdiv>' +\n        '<a href=\"#\" data-op style=\"font-weight:600;font-size:13.5px;color:#1E8FD8\">Details →<\u002Fa>',\n        { className: \"pin-pop\" }\n      );\n      m.on(\"popupopen\", (ev) => {\n        const a = ev.popup.getElement().querySelector(\"[data-op]\");\n        if (a) a.onclick = (e) => { e.preventDefault(); this.setState({ drawer: o }); };\n      });\n      this.markers.addLayer(m);\n    });\n    if (pts.length) this.map.fitBounds(pts, { padding: [40, 40], maxZoom: 11 });\n    setTimeout(() => { if (this.map) this.map.invalidateSize(); }, 60);\n  }\n\n  chipStyle(on, small) {\n    return {\n      border: \"1.5px solid \" + (on ? \"transparent\" : \"#DCEBF4\"),\n      background: on ? \"linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8)\" : \"#fff\",\n      color: on ? \"#fff\" : \"#33506A\",\n      borderRadius: \"999px\",\n      padding: small ? \"6px 14px\" : \"8px 16px\",\n      fontSize: small ? \"13px\" : \"14px\",\n      fontWeight: 600,\n      display: \"inline-flex\", alignItems: \"center\", gap: \"8px\", whiteSpace: \"nowrap\",\n      boxShadow: on ? \"0 4px 14px rgba(32,152,224,.28)\" : \"none\",\n      transition: \"border-color .12s, box-shadow .12s\"\n    };\n  }\n\n  renderVals() {\n    const S = this.state;\n    const list = this.filtered();\n    const regions = [...new Set(S.ops.map(o => o.region))];\n    const cats = [...new Set(S.ops.flatMap(o => o.categories))];\n\n    const catChips = [{\n      key: null, label: \"Everything\", count: S.ops.length,\n      on: S.cat === null, icon: this.icon(\"more\", S.cat === null ? \"#fff\" : \"#2098E0\", 17),\n      onClick: () => this.setState({ cat: null }),\n      style: this.chipStyle(S.cat === null, false),\n      nStyle: { fontSize: \"12px\", color: S.cat === null ? \"rgba(255,255,255,.85)\" : \"#8AA3B5\" }\n    }].concat(Object.entries(this.CATS).filter(([k]) => cats.includes(k)).map(([k, c]) => {\n      const on = S.cat === k;\n      return {\n        key: k, label: c.label,\n        count: S.ops.filter(o => o.categories.includes(k)).length,\n        icon: this.icon(c.icon, on ? \"#fff\" : \"#2098E0\", 17),\n        onClick: () => this.setState({ cat: on ? null : k }),\n        style: this.chipStyle(on, false),\n        nStyle: { fontSize: \"12px\", color: on ? \"rgba(255,255,255,.85)\" : \"#8AA3B5\" }\n      };\n    }));\n\n    const regionChips = [{ key: null, label: \"All\" }].concat(regions.map(r => ({ key: r, label: this.REGIONS[r] || r })))\n      .map(rc => ({\n        label: rc.label,\n        onClick: () => this.setState({ region: (S.region === rc.key && rc.key !== null) ? null : rc.key }),\n        style: this.chipStyle(S.region === rc.key, true)\n      }));\n\n    const cards = list.map(o => {\n      const c0 = this.CATS[o.categories[0]] || this.CATS.other;\n      return {\n        name: o.name,\n        townLine: o.town + \" · \" + (this.REGIONS[o.region] || o.region),\n        rentsLine: (o.rents || []).slice(0, 3).join(\" · \"),\n        catLabel: c0.label,\n        icon: this.icon(c0.icon, \"#1E8FD8\", 46),\n        hasPhoto: !!(o.photos && o.photos.length && window.__MAPS_KEY),\n        noPhoto: !(o.photos && o.photos.length && window.__MAPS_KEY),\n        photoUrl: (o.photos && o.photos.length && window.__MAPS_KEY) ? (\"https://places.googleapis.com/v1/\" + o.photos[0].name + \"/media?maxHeightPx=400&maxWidthPx=800&key=\" + window.__MAPS_KEY) : \"\",\n        hasRating: !!o.rating,\n        ratingText: o.rating ? (o.rating + \" \u2605 \u00b7 \" + (o.reviewCount || 0) + \" reviews\") : \"\",\n        hasPrice: !!o.priceSignal, noPrice: !o.priceSignal,\n        priceText: o.priceSignal || \"\",\n        badgeOnline: o.bookingMode === \"online\",\n        badgePhone: o.bookingMode === \"phone-only\",\n        open: () => this.setState({ drawer: o })\n      };\n    });\n\n    const dOp = S.drawer;\n    const d = dOp ? {\n      cats: dOp.categories.map(c => (this.CATS[c] || this.CATS.other).label).join(\" · \"),\n      name: dOp.name,\n      townLine: dOp.town + \" · \" + (this.REGIONS[dOp.region] || dOp.region),\n      blurb: dOp.blurb || \"\",\n      rents: (dOp.rents || []).map(t => ({ t })),\n      hasPrice: !!dOp.priceSignal, priceText: dOp.priceSignal || \"\",\n      mode: dOp.bookingMode === \"online\" ? \"Online booking\" : (dOp.bookingMode === \"phone-only\" ? \"Phone to book\" : \"—\"),\n      hasSite: !!dOp.website, website: dOp.website || \"#\",\n      hasPhone: !!dOp.phone, phone: dOp.phone || \"\", tel: \"tel:\" + (dOp.phone || \"\"),\n      verified: dOp.verified || \"\"\n    } : { rents: [] };\n\n    const toggleBtn = (on) => ({\n      border: 0, background: on ? \"linear-gradient(120deg,#4870F8,#2098E0 55%,#00B8C8)\" : \"#fff\",\n      padding: \"8px 20px\", fontWeight: 700, fontSize: \"13.5px\",\n      color: on ? \"#fff\" : \"#5A7386\"\n    });\n\n    return {\n      heroArt: this.props.heroArt ?? true,\n      showCounts: this.props.chipCounts ?? true,\n      nOps: S.ops.length, nRegions: regions.length,\n      q: S.q,\n      onSearch: (e) => this.setState({ q: e.target.value }),\n      onSearchKey: (e) => { if (e.key === \"Enter\") this.goDir(); },\n      goExplore: () => this.goDir(),\n      catChips, regionChips, cards,\n      nResults: list.length,\n      resultsWord: list.length === 1 ? \"operator\" : \"operators\",\n      isList: S.view === \"list\", isMap: S.view === \"map\",\n      setList: () => this.setState({ view: \"list\" }),\n      setMap: () => this.setState({ view: \"map\" }),\n      listBtnStyle: toggleBtn(S.view === \"list\"),\n      mapBtnStyle: toggleBtn(S.view === \"map\"),\n      mapRef: this.mapRef,\n      drawerOpen: !!S.drawer, d,\n      closeDrawer: () => this.setState({ drawer: null })\n    };\n  }\n\n  goDir() {\n    const el = document.getElementById(\"directory\");\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: \"smooth\" });\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
